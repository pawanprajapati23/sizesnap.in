name: Daily Sarkari Jobs Auto-Blogger

on:
  schedule:
    # Runs at 1:00 AM IST every day (which is 19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Auto-Blogger Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sarkari-jobs/
          if ! git diff --staged --quiet; then
            git commit -m "auto: publish new sarkari job post"
            git push
          fi
