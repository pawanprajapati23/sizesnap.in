name: Daily Sarkari Jobs Auto-Blogger

on:
  schedule:
    # Runs at 1:00 AM IST every day (which is 19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-sarkari-jobs
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Auto-Blogger Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Commit and Push Changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add data/sarkari-jobs/

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "auto: publish new sarkari job post"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflict: generated files overlap with new changes on main"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Changes pushed successfully"
              exit 0
            fi

            echo "Push failed on attempt $attempt; retrying..."
            sleep 5
          done

          echo "Unable to push after 3 attempts"
          exit 1
