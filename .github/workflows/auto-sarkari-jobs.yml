name: Daily Sarkari Jobs Auto-Blogger

on:
  schedule:
    # Runs at 6:00 AM IST every day (which is 00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

# Prevent multiple workflow runs from pushing to main simultaneously.
concurrency:
  group: daily-sarkari-jobs-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Auto-Blogger Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: node scripts/fetch-jobs.mjs

      - name: Commit and Push Changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/sarkari-jobs/

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "auto: publish new sarkari job post"

          # Try up to three times in case main changes while pushing.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            # Rebase the generated commit onto the latest remote main.
            git rebase origin/main || {
              echo "Rebase failed. Aborting rebase."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Changes pushed successfully."
              exit 0
            fi

            echo "Push was rejected. Retrying..."
            sleep 5
          done

          echo "Failed to push changes after three attempts."
          exit 1
