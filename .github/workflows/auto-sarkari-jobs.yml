name: Daily Sarkari Jobs Auto-Blogger

on:
  schedule:
    # Runs at 1:00 AM IST every day (which is 19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: daily-sarkari-jobs-publisher
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Auto-Blogger Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Commit and Push Changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add data/sarkari-jobs/

          if git diff --staged --quiet; then
            exit 0
          fi

          git commit -m "auto: publish new sarkari job post"

          git fetch origin main
          git rebase origin/main

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed; retrying after rebasing... (attempt $attempt/5)"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done

          echo "Unable to push after multiple attempts"
          exit 1
